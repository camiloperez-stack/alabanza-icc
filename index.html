<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alabanza ICC Casa de Pan</title>
  
  <!-- Fuente Poppins + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800;900&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #070913;
      --card-bg: rgba(22, 28, 45, 0.85);
      --accent-yellow: #facc15;
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-purple: #7f00ff;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: 'Poppins', sans-serif; 
      background-color: var(--bg-dark); 
      color: var(--text-main); 
      padding: 40px 15px; 
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
      background-image: 
        radial-gradient(at 10% 10%, rgba(250, 204, 21, 0.08) 0px, transparent 50%),
        radial-gradient(at 90% 90%, rgba(0, 242, 254, 0.1) 0px, transparent 50%);
      background-attachment: fixed;
    }

    /* Elementos Vectoriales Lineales Amarillos en Fondo */
    .vector-bg-1 {
      position: absolute;
      top: 50px;
      left: -40px;
      width: 180px;
      height: 180px;
      border: 2px dashed rgba(250, 204, 21, 0.25);
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .vector-bg-2 {
      position: absolute;
      bottom: 80px;
      right: -30px;
      width: 220px;
      height: 220px;
      border: 1px solid rgba(250, 204, 21, 0.18);
      transform: rotate(45deg);
      pointer-events: none;
      z-index: 0;
    }

    .container { 
      position: relative;
      z-index: 10;
      max-width: 900px; 
      margin: 0 auto; 
      background: var(--card-bg); 
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 40px 36px; 
      border-radius: 28px; 
      box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.8), 0 0 40px rgba(250, 204, 21, 0.08); 
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    /* Encabezado con juego tipográfico 300 Light vs 900 Black */
    .header { text-align: center; margin-bottom: 36px; position: relative; }
    
    /* Figura vectorial sobre el título */
    .header::before {
      content: '';
      position: absolute;
      top: -15px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: var(--accent-yellow);
      border-radius: 2px;
      box-shadow: 0 0 10px rgba(250, 204, 21, 0.6);
    }

    .header .sub-brand { 
      font-weight: 300; 
      font-size: 14px; 
      letter-spacing: 6px; 
      color: var(--accent-yellow); 
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .header h1 { 
      font-size: 34px; 
      font-weight: 900; 
      letter-spacing: -1px;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 40%, var(--accent-yellow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p { 
      color: var(--text-muted); 
      font-size: 12px; 
      font-weight: 300; 
      text-transform: uppercase; 
      letter-spacing: 3px; 
    }

    .selector-box { margin-bottom: 28px; }
    .selector-box label { 
      display: block; 
      font-size: 11px; 
      font-weight: 700; 
      color: var(--accent-yellow); 
      text-transform: uppercase; 
      letter-spacing: 2px; 
      margin-bottom: 10px; 
    }
    select { 
      width: 100%; 
      padding: 18px 22px; 
      border-radius: 16px; 
      background: #0d1322; 
      color: #ffffff; 
      border: 1px solid rgba(250, 204, 21, 0.3); 
      font-size: 16px; 
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      outline: none;
      cursor: pointer;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
      transition: all 0.3s ease;
    }
    select:focus { border-color: var(--accent-yellow); box-shadow: 0 0 20px rgba(250, 204, 21, 0.3); }

    .video-container { 
      position: relative; 
      padding-bottom: 56.25%; 
      height: 0; 
      overflow: hidden; 
      border-radius: 22px; 
      margin-bottom: 30px; 
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
    }
    .video-container iframe { position: absolute; top:0; left:0; width:100%; height:100%; border:0; }

    .controls { 
      display: flex; 
      flex-wrap: wrap;
      gap: 16px; 
      align-items: center; 
      background: rgba(13, 19, 34, 0.9); 
      padding: 22px 28px; 
      border-radius: 20px; 
      margin-bottom: 30px; 
      justify-content: space-between; 
      border: 1px solid rgba(250, 204, 21, 0.2);
    }
    .transpose-status { font-size: 14px; font-weight: 300; color: var(--text-muted); }
    .transpose-status span { color: var(--accent-yellow); font-weight: 800; font-size: 18px; margin-left: 4px; }

    .btn-group { display: flex; gap: 10px; }
    button { 
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple)); 
      color: white; 
      border: none; 
      padding: 12px 22px; 
      border-radius: 12px; 
      cursor: pointer; 
      font-family: 'Poppins', sans-serif;
      font-weight: 700; 
      font-size: 13px;
      letter-spacing: 0.5px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(127, 0, 255, 0.5); }
    button.reset { background: #334155; box-shadow: none; font-weight: 400; }
    button.reset:hover { background: #475569; }

    /* Tarjeta con acento lineal amarillo */
    .info-card { 
      position: relative;
      background: rgba(13, 19, 34, 0.95); 
      padding: 30px; 
      border-radius: 22px; 
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .info-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-yellow), var(--accent-cyan));
    }

    .song-title { font-size: 26px; font-weight: 900; color: #ffffff; margin-bottom: 4px; letter-spacing: -0.5px; }
    .key-info { font-size: 14px; font-weight: 300; color: var(--text-muted); margin-bottom: 22px; }
    .key-info strong { color: var(--accent-yellow); font-weight: 700; }

    .chords-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; }
    .chords-display { 
      font-family: 'JetBrains Mono', monospace; 
      background: #050811; 
      padding: 20px 26px; 
      border-radius: 16px; 
      color: var(--accent-yellow); 
      font-size: 24px; 
      font-weight: 700;
      letter-spacing: 4px; 
      border: 1px dashed rgba(250, 204, 21, 0.3);
      margin-bottom: 26px;
      box-shadow: 0 0 20px rgba(250, 204, 21, 0.05);
    }

    .btn-link { 
      display: inline-flex; 
      align-items: center;
      gap: 10px;
      background: var(--accent-yellow); 
      color: #070913; 
      text-decoration: none; 
      padding: 14px 28px; 
      border-radius: 14px; 
      font-weight: 800; 
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 18px rgba(250, 204, 21, 0.3);
    }
    .btn-link:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(250, 204, 21, 0.5); }
  </style>
</head>
<body>

<!-- Elementos vectoriales lineales amarillos de fondo -->
<div class="vector-bg-1"></div>
<div class="vector-bg-2"></div>

<div class="container">
  <div class="header">
    <div class="sub-brand">Ministerio de Alabanza</div>
    <h1>ICC Casa de Pan</h1>
    <p>Centro de Control & Transposición</p>
  </div>

  <div class="selector-box">
    <label for="songSelect">Selecciona una canción del repertorio:</label>
    <select id="songSelect" onchange="cargarCancion()"></select>
  </div>

  <div class="video-container">
    <iframe id="youtubePlayer" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  </div>

  <div class="controls">
    <div class="transpose-status">
      Ajuste Transpose: <span id="transposeLabel">0 semitonos</span>
    </div>
    <div class="btn-group">
      <button onclick="cambiarTono(-1)">-1 Semitono</button>
      <button class="reset" onclick="restablecerTono()">Restablecer</button>
      <button onclick="cambiarTono(1)">+1 Semitono</button>
    </div>
  </div>

  <div class="info-card">
    <div class="song-title" id="songTitle"></div>
    <div class="key-info">Tono Objetivo: <strong id="currentKey"></strong></div>
    
    <div class="chords-label">Acordes Principales:</div>
    <div id="chordsDisplay" class="chords-display"></div>

    <a id="sheetLink" class="btn-link" target="_blank" rel="noopener">📄 Ver Cifra / Letra Completa</a>
  </div>
</div>

<script>
  const escala = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

  const repertorio = [
    {
      titulo: "Eco (Echo) - Elevation Worship",
      videoId: "GNt1msD_KjA",
      tonoBase: "D",
      linkCifra: "https://www.cifraclub.com/elevation-worship/eco/",
      acordes: ["D", "G", "Bm", "A"]
    },
    {
      titulo: "Salvavidas - Su Presencia",
      videoId: "TTCUpzIXIrs",
      tonoBase: "C",
      linkCifra: "https://chordify.net/es/chords/salvavidas-su-presencia-worship-nueva-musica-cristiana-2026-su-presencia-worship",
      acordes: ["C", "G", "Am", "F"]
    },
    {
      titulo: "Suelto - Sarai Rivera",
      videoId: "sJiRfztXcJc",
      tonoBase: "F#",
      linkCifra: "https://www.cifraclub.com/sarai-rivera/suelto/",
      acordes: ["F#m", "D", "A", "E"]
    },
    {
      titulo: "Me has hecho libre - Esperanza de Vida",
      videoId: "4RhzHB8ntuc",
      tonoBase: "A",
      linkCifra: "https://www.cifraclub.com/esperanza-de-vida/me-has-hecho-libre/",
      acordes: ["A", "E", "F#m", "D"]
    },
    {
      titulo: "El poder de tu amor - Ingrid Rosario",
      videoId: "Tssk5UWxvuw",
      tonoBase: "E",
      linkCifra: "https://www.cifraclub.com/ingrid-rosario/el-poder-de-tu-amor/wjptsj.html",
      acordes: ["Em", "D", "C", "G"]
    }
  ];

  let semitonosActuales = 0;
  let cancionActual = 0;

  const select = document.getElementById("songSelect");
  repertorio.forEach((song, idx) => {
    let opt = document.createElement("option");
    opt.value = idx;
    opt.textContent = song.titulo;
    select.appendChild(opt);
  });

  function transponerNota(nota, semitonos) {
    let esMenor = nota.includes("m") && !nota.includes("Em");
    let notaLimpia = nota.replace("m", "");
    let idx = escala.indexOf(notaLimpia);
    if (idx === -1) return nota;
    let nuevoIdx = (idx + semitonos) % 12;
    if (nuevoIdx < 0) nuevoIdx += 12;
    return escala[nuevoIdx] + (esMenor ? "m" : "");
  }

  function cargarCancion() {
    cancionActual = select.value;
    semitonosActuales = 0;
    actualizarVista();
  }

  function cambiarTono(delta) {
    semitonosActuales += delta;
    actualizarVista();
  }

  function restablecerTono() {
    semitonosActuales = 0;
    actualizarVista();
  }

  function actualizarVista() {
    const song = repertorio[cancionActual];
    document.getElementById("youtubePlayer").src = `https://www.youtube.com/embed/${song.videoId}`;
    document.getElementById("songTitle").innerText = song.titulo;
    document.getElementById("sheetLink").href = song.linkCifra;
    document.getElementById("transposeLabel").innerText = `${semitonosActuales > 0 ? '+' : ''}${semitonosActuales} semitonos`;

    let nuevoTono = transponerNota(song.tonoBase, semitonosActuales);
    document.getElementById("currentKey").innerText = `${nuevoTono} (${semitonosActuales === 0 ? 'Original' : 'Transpuesto'})`;

    let nuevosAcordes = song.acordes.map(a => transponerNota(a, semitonosActuales));
    document.getElementById("chordsDisplay").innerText = nuevosAcordes.join("  —  ");
  }

  cargarCancion();
</script>

</body>
</html>
